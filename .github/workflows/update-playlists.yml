name: Update M3U Playlists

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate M3U playlists and website
        run: python scripts/generate_playlists.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Check for changes
        id: changes
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No playlist changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Playlist changes detected."
            git diff --cached --stat
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "Auto-update playlists ${TIMESTAMP}"
          git push
